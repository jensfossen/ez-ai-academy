<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-label="Prompt engineering map. Direct AI toward useful work. Outcome, inputs, boundaries, shape, then check.">
  <rect width="900" height="1200" fill="#F5F8FB"/>
  <rect width="900" height="168" fill="#0B1730"/>
  <rect x="36" y="28" width="88" height="64" rx="18" fill="none" stroke="#F5F8FB" stroke-width="6"/>
  <path d="M48 88 L40 118 L72 94" fill="none" stroke="#F5F8FB" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#72E0D1">
    <rect x="58" y="68" width="10" height="10" rx="2"/>
    <rect x="72" y="68" width="10" height="10" rx="2"/>
    <rect x="72" y="54" width="10" height="10" rx="2"/>
    <rect x="86" y="68" width="10" height="10" rx="2"/>
    <rect x="86" y="54" width="10" height="10" rx="2"/>
    <rect x="86" y="40" width="10" height="10" rx="2"/>
  </g>
  <text x="500" y="72" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">PROMPT ENGINEERING</text>
  <text x="500" y="112" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="20" fill="#72E0D1">Direct AI toward useful work</text>
  <rect x="72" y="148" width="756" height="6" fill="#C4A35A"/>
  <g>
    <rect x="40" y="196" width="820" height="168" rx="18" fill="#FFFFFF" stroke="#C5D0DC" stroke-width="2"/>
    <circle cx="86" cy="240" r="22" fill="#72E0D1"/>
    <text x="86" y="247" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="20" font-weight="700" fill="#0B1730">1</text>
    <text x="126" y="244" font-family="Inter, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#0B1730">OUTCOME</text>
    <text x="126" y="282" font-family="Inter, Noto Sans, sans-serif" font-size="18" fill="#4A5568">Name the useful result, who it is for, and what they will do next.</text>
  </g>
  <g>
    <rect x="40" y="382" width="820" height="168" rx="18" fill="#FFFFFF" stroke="#C5D0DC" stroke-width="2"/>
    <circle cx="86" cy="426" r="22" fill="#72E0D1"/>
    <text x="86" y="433" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="20" font-weight="700" fill="#0B1730">2</text>
    <text x="126" y="430" font-family="Inter, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#0B1730">INPUTS</text>
    <text x="126" y="468" font-family="Inter, Noto Sans, sans-serif" font-size="18" fill="#4A5568">Give the information the job needs. Leave out decoration.</text>
  </g>
  <g>
    <rect x="40" y="568" width="820" height="168" rx="18" fill="#FFFFFF" stroke="#C5D0DC" stroke-width="2"/>
    <circle cx="86" cy="612" r="22" fill="#72E0D1"/>
    <text x="86" y="619" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="20" font-weight="700" fill="#0B1730">3</text>
    <text x="126" y="616" font-family="Inter, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#0B1730">BOUNDARIES</text>
    <text x="126" y="654" font-family="Inter, Noto Sans, sans-serif" font-size="18" fill="#4A5568">Say what to include, avoid, or put first. Keep unknowns visible.</text>
  </g>
  <g>
    <rect x="40" y="754" width="820" height="168" rx="18" fill="#FFFFFF" stroke="#C5D0DC" stroke-width="2"/>
    <circle cx="86" cy="798" r="22" fill="#72E0D1"/>
    <text x="86" y="805" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="20" font-weight="700" fill="#0B1730">4</text>
    <text x="126" y="802" font-family="Inter, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#0B1730">SHAPE</text>
    <text x="126" y="840" font-family="Inter, Noto Sans, sans-serif" font-size="18" fill="#4A5568">Choose a format the next person can actually use.</text>
  </g>
  <g>
    <rect x="40" y="940" width="820" height="168" rx="18" fill="#FFFFFF" stroke="#C5D0DC" stroke-width="2"/>
    <circle cx="86" cy="984" r="22" fill="#72E0D1"/>
    <text x="86" y="991" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="20" font-weight="700" fill="#0B1730">5</text>
    <text x="126" y="988" font-family="Inter, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#0B1730">CHECK</text>
    <text x="126" y="1026" font-family="Inter, Noto Sans, sans-serif" font-size="18" fill="#4A5568">Inspect the result. Improve the instruction from what you see.</text>
  </g>
  <rect y="1108" width="900" height="92" fill="#0B1730"/>
  <text x="450" y="1162" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Clear direction, then inspect the result — not a longer prompt.</text>
</svg>
