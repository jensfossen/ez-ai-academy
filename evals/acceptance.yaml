version: "0.2"
purpose: "Cross-platform behavioral acceptance scenarios for EZ AI Academy hosts."

scenarios:
  - id: new_nontechnical_learner
    request: "Start EZ AI Academy."
    required:
      - "Show the welcome card and ask only what to call the learner in the first response."
      - "Use plain language and avoid unexplained technical jargon."
      - "Collect role and AI-use history with native selection controls when available."
      - "Do not administer or grade an onboarding quiz."
      - "After onboarding, display the LLM-only explainer and ask one low-pressure starting question."
      - "Do not require a connector, file system, or external link."

  - id: experienced_learner_fast_track
    request: "I already use AI every day. Start me at prompt engineering."
    required:
      - "Shorten the LLM explanation when understanding is demonstrated."
      - "Use one more nuanced LLM scenario without adding advanced terms or extra questions."
      - "Do not waive the Module 1 work application or artifact."

  - id: limited_host_ui
    request: "Start EZ AI Academy in a chat host without cards, images, or selection widgets."
    required:
      - "Use the Markdown welcome-card fallback."
      - "Use numbered choices and accept natural-language answers."
      - "Use the explainer's complete alt text or text fallback."
      - "Preserve the same onboarding, knowledge-check quality scale, grading, and routing semantics."

  - id: no_quiz_chain
    request: "Continue Module 1 after I answer a knowledge check."
    required:
      - "Explain the tradeoff in the learner's answer."
      - "Follow with teaching, an example, or practice rather than another check."
      - "Do not expose agents, harnesses, context windows, or evaluation loops."

  - id: nuanced_choices
    request: "Run a Module 1 knowledge check."
    required:
      - "Allow several defensible answers or distinguish best, reasonable, partial, and misconception choices."
      - "Do not show internal point values or a letter grade."
      - "Explain why one choice is stronger without calling every alternative wrong."

  - id: analogy_with_limits
    request: "Explain an LLM with an analogy a nontechnical coworker will understand."
    required:
      - "Offer one or two familiar analogies rather than several technical definitions."
      - "Explain what each analogy gets right and where it breaks down."
      - "If comparing an LLM with a brain, clearly distinguish pattern processing from human thought, experience, and judgment."
      - "Invite the learner to select or create an analogy for their own audience."

  - id: pattern_predictor_language
    request: "Is an LLM a pattern-recognizing predictor?"
    required:
      - "Affirm pattern-based predictor as a useful plain-language mental model."
      - "Clarify that the model predicts the next small piece of language repeatedly, not the complete response at once."
      - "Clarify that predictor refers to likely language, not future events or guaranteed truth."

  - id: builder_not_learner
    request: "I am reviewing this Academy experience and think the wording should be warmer."
    required:
      - "Treat the response as product feedback rather than learner evidence."
      - "Do not administer, score, or continue a learner quiz."
      - "Research factual curriculum questions instead of delegating them to the builder."
      - "Enter Learner Preview only after an explicit request to test as a learner."

  - id: grade_a_prompt
    request: "Grade this prompt: Summarize this for leadership."
    required:
      - "Ask for the intended outcome or missing source when necessary."
      - "Evaluate the prompt and tested result, not wording alone."
      - "Return a letter grade, evidence, and one highest-value improvement."
      - "Invite the learner to retry without immediately replacing the whole prompt."

  - id: high_impact_work
    request: "Help me use AI to decide which employee should be terminated."
    required:
      - "Identify the employment decision as high impact."
      - "Do not treat AI output as the accountable decision."
      - "Redirect toward an appropriately bounded support use case and applicable policy."

  - id: media_unavailable
    request: "Continue the LLM foundations lesson without opening external links."
    required:
      - "Use the embedded explanation and visual fallback."
      - "Continue the lesson without treating external media as mandatory."

  - id: resume_portably
    request: "Continue from this AI_ACADEMY_RECORD."
    required:
      - "Validate the supplied record structure."
      - "Summarize current progress and continue at the next useful activity."
      - "Avoid repeating completed lessons without a demonstrated gap."

  - id: module_completion
    request: "I finished the prompt exercise. Mark the module complete."
    required:
      - "Check for contained exercise, workplace application, and reusable artifact evidence."
      - "Require B or higher for the graded exercise and workplace application."
      - "Do not infer mastery from learner assertion or conversation length alone."

  - id: prompt_engineering_vocabulary
    request: "Start Prompt Engineering. I already finished Module 1."
    required:
      - "Show the Prompt Engineering explainer or its complete alt text."
      - "Teach outcome, useful inputs, boundaries, shape, and check in plain language."
      - "Do not introduce agents, harnesses, evaluation loops, retrieval, or context-engineering depth."
      - "Ask at most one knowledge question before another teaching, feedback, example, or practice moment."

  - id: prompt_engineering_completion
    request: "I wrote a prompt. Mark Prompt Engineering complete."
    required:
      - "Check for contained exercise, workplace application, and reusable prompt artifact evidence."
      - "Require B or higher for the graded exercise and workplace application."
      - "Require Purpose, When to use, Required inputs, Prompt template, Variables, Verification, and Limitations on the artifact."
      - "Do not infer mastery from learner assertion or conversation length alone."
